<!DOCTYPE html>
<!--
  LITTLE EXPLORERS  -  a Montessori-inspired learning app for children aged 4 to 5
  ONE FILE: index.html.  Just open it in Google Chrome. No internet, no installing, no accounts.

  HOW THIS FILE IS ORGANISED (use Ctrl+F in VS Code to jump to a heading)
    1. <style> blocks ..... all the colours, sizes and animations
    2. <header>/<main> .... the page skeleton (top bar, menu, empty area that screens are drawn into)
    3. CORE script ........ saving progress, stars, badges, audio, screens (Home, Learn, Play, Progress, Parents)
    4. LESSON KIT ......... shared helpers that every activity uses (questions, feedback, finish screen)
    5. ACTIVITY scripts ... ALPHABET, NUMBER, COLORS & SHAPES, ANIMAL KINGDOM, GAME ENGINES, GAMES, PRACTICAL LIFE

  PRIVACY: nothing is sent anywhere. Progress is saved only in this browser (localStorage).
  There are no ads, no tracking, no external links and no sign-up.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Little Explorers: a safe, ad-free Montessori-inspired learning app for children aged 4 to 5.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%AD%90%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff8ec">
<title>Little Explorers – Montessori Learning for Ages 4–5</title>
<style>
/* =========================================================
   LITTLE EXPLORERS — STYLES
   1. Design tokens   2. Base   3. Layout & nav
   4. Components      5. Screens   6. Animations
   ========================================================= */

/* ---------- 1. DESIGN TOKENS ---------- */
:root{
  --cream:#fff8ec;
  --blue:#cfe8ff;   --blue-d:#5aaaf0;
  --yellow:#fff2b3; --yellow-d:#f2c230;
  --peach:#ffdcc2;  --peach-d:#f59a5b;
  --lav:#e3d9ff;    --lav-d:#9a82e6;
  --mint:#cdf3df;   --mint-d:#47c28a;
  --pink:#ffd6e6;   --pink-d:#ee7fa9;
  --ink:#3b2f4a;    --ink-soft:#6f6380;
  --card:#ffffff;
  --radius:28px;    --radius-s:18px;
  --shadow:0 10px 30px rgba(120,90,160,.14);
  --shadow-s:0 4px 14px rgba(120,90,160,.12);
  --font:"Nunito","Baloo 2","Trebuchet MS","Segoe UI",ui-rounded,system-ui,sans-serif;
}

/* ---------- 2. BASE ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);color:var(--ink);background:var(--cream);
  min-height:100vh;line-height:1.45;font-size:18px;
  -webkit-tap-highlight-color:transparent;overflow-x:hidden;
}
body::before{ /* soft pastel blobs */
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(420px 320px at 8% 12%,var(--blue) 0%,transparent 70%),
    radial-gradient(380px 300px at 92% 8%,var(--pink) 0%,transparent 70%),
    radial-gradient(460px 340px at 85% 90%,var(--mint) 0%,transparent 70%),
    radial-gradient(400px 300px at 6% 88%,var(--lav) 0%,transparent 70%);
  opacity:.75;
}
h1,h2,h3{line-height:1.15;font-weight:900}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
:focus-visible{outline:4px solid var(--lav-d);outline-offset:3px;border-radius:14px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* ---------- 3. LAYOUT & NAV ---------- */
.topbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;
  padding:10px clamp(12px,3vw,32px);
  background:rgba(255,248,236,.88);backdrop-filter:blur(10px);
  border-bottom:3px dashed rgba(154,130,230,.25);
}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:clamp(20px,3.4vw,28px);letter-spacing:-.5px}
.logo-badge{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,var(--yellow),var(--peach));
  display:grid;place-items:center;box-shadow:var(--shadow-s);transform:rotate(-6deg)}
.logo b{color:var(--peach-d)} .logo i{font-style:normal;color:var(--lav-d)}
.spacer{flex:1}
.nav{display:flex;gap:6px}
.nav button{padding:10px 16px;border-radius:999px;font-weight:800;font-size:16px;color:var(--ink-soft);transition:.2s}
.nav button:hover{background:var(--lav)}
.nav button[aria-current="page"]{background:var(--lav-d);color:#fff;box-shadow:var(--shadow-s)}
.nav .ico{display:none;font-size:22px;line-height:1}
.hud{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--yellow);
  font-weight:900;box-shadow:var(--shadow-s)}
.pill.bump{animation:bump .5s}
.icon-btn{width:44px;height:44px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-size:20px;box-shadow:var(--shadow-s)}
main{max-width:1180px;margin:0 auto;padding:22px clamp(14px,3vw,32px) 120px}
.view{animation:viewIn .45s ease both}
footer{text-align:center;color:var(--ink-soft);font-size:14px;padding:0 16px 100px}

/* ---------- 4. COMPONENTS ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  padding:16px 28px;border-radius:999px;font-weight:900;font-size:20px;
  background:var(--peach-d);color:#fff;box-shadow:0 6px 0 #d97b3b,var(--shadow-s);
  transition:transform .12s, box-shadow .12s;min-height:56px;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d97b3b}
.btn.blue{background:var(--blue-d);box-shadow:0 6px 0 #3a88cf,var(--shadow-s)}
.btn.mint{background:var(--mint-d);box-shadow:0 6px 0 #2fa06b,var(--shadow-s)}
.btn.lav{background:var(--lav-d);box-shadow:0 6px 0 #7a63c8,var(--shadow-s)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #e4dcf3,var(--shadow-s)}
.btn.big{font-size:24px;padding:20px 36px;min-height:68px}
.btn.small{font-size:16px;padding:10px 18px;min-height:44px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.bar{height:16px;background:rgba(59,47,74,.08);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--c,var(--mint-d));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.tag{display:inline-block;padding:4px 12px;border-radius:99px;font-size:14px;font-weight:800;background:rgba(255,255,255,.75)}
.bubble{position:relative;background:#fff;border-radius:22px;padding:14px 18px;box-shadow:var(--shadow-s);font-weight:800;max-width:340px}
.bubble::after{content:"";position:absolute;bottom:-12px;left:36px;border:12px solid transparent;border-top-color:#fff;border-bottom:0}
.ring{--p:0;--c:var(--mint-d);width:130px;height:130px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(59,47,74,.08) 0)}
.ring>div{width:98px;height:98px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;font-weight:900;font-size:28px;line-height:1}
.ring small{display:block;font-size:12px;color:var(--ink-soft);font-weight:800}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:14px 8px;border-radius:var(--radius-s);background:var(--cream);font-weight:800;font-size:14px}
.badge .b-ico{font-size:34px}
.badge.locked{filter:grayscale(1);opacity:.45}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,30px);opacity:0;z-index:100;background:var(--ink);color:#fff;
  padding:14px 22px;border-radius:99px;font-weight:800;transition:.35s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;z-index:120;pointer-events:none;font-size:22px;animation:fly .9s ease-out forwards}

/* ---------- 5. SCREENS ---------- */
/* Home hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:22px;align-items:stretch}
.hero-text{background:linear-gradient(135deg,var(--yellow),var(--peach));display:flex;flex-direction:column;gap:16px;justify-content:center}
.hero-text h1{font-size:clamp(34px,5.2vw,54px)}
.hero-text h1 span{color:var(--lav-d)}
.daily{background:rgba(255,255,255,.7);border-radius:var(--radius-s);padding:14px 16px;display:flex;gap:12px;align-items:center}
.daily .sun{font-size:34px;animation:spin 14s linear infinite}
.daily p{font-weight:800;flex:1;font-size:17px}
.daily small{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--peach-d);font-weight:900}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.stage{background:linear-gradient(180deg,var(--blue) 0%,var(--mint) 100%);position:relative;overflow:hidden;min-height:340px;
  display:flex;flex-direction:column;justify-content:flex-end;padding:18px}
.stage .cloud{position:absolute;font-size:46px;opacity:.9;animation:drift 18s linear infinite}
.stage .hill{position:absolute;left:-10%;right:-10%;bottom:-70px;height:150px;border-radius:50%;background:var(--mint-d);opacity:.55}
.stage .bubble-wrap{position:relative;z-index:2;margin-bottom:18px;min-height:64px}
.crew{position:relative;z-index:2;display:flex;justify-content:center;align-items:flex-end;gap:0}
.char-btn{width:19%;min-width:60px;transition:transform .2s;animation:bob 3s ease-in-out infinite;animation-delay:var(--d,0s)}
.char-btn:nth-child(even){margin-bottom:14px}
.char-btn:hover{transform:scale(1.15) rotate(-4deg)}
.char-btn:active{transform:scale(.95)}
.char-btn .met{display:block;font-size:13px;font-weight:900;text-align:center;margin-top:-4px}
.char svg{width:100%;height:auto;display:block;overflow:visible}
.eyes ellipse.blinky{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}

.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:34px 4px 14px}
.section-title h2{font-size:clamp(24px,3.4vw,32px)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.cat{position:relative;text-align:left;border-radius:var(--radius);padding:18px;background:var(--bg);box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:10px;transition:transform .2s, box-shadow .2s;overflow:hidden}
.cat:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 16px 36px rgba(120,90,160,.22)}
.cat:active{transform:scale(.97)}
.cat .char{width:110px;align-self:center;animation:bob 3.4s ease-in-out infinite}
.cat h3{font-size:24px}
.cat p{font-size:15px;font-weight:700;color:rgba(59,47,74,.75)}
.cat .glyph{position:absolute;top:10px;right:14px;font-size:40px;font-weight:900;opacity:.35}
.cat .row{display:flex;justify-content:space-between;font-size:14px;font-weight:900}

.dash{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.progress-card{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1;min-width:240px}
.stat{background:var(--cream);border-radius:var(--radius-s);padding:12px;text-align:center}
.stat b{display:block;font-size:30px}
.stat span{font-size:13px;font-weight:800;color:var(--ink-soft)}
.shelf{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:10px}
.slot{aspect-ratio:1;border-radius:12px;background:var(--cream);display:grid;place-items:center;font-size:clamp(14px,2.4vw,26px);color:#e6dccd}
.slot.on{background:var(--yellow);color:var(--yellow-d);animation:pop .5s both}
.parent-cta{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--lav),var(--pink));flex-wrap:wrap}
.parent-cta div{flex:1;min-width:200px}

/* Category screen */
.crumbs{margin-bottom:14px}
.cat-hero{display:grid;grid-template-columns:240px 1fr;gap:24px;align-items:center;background:var(--bg)}
.cat-hero .char{width:100%;animation:bob 3s ease-in-out infinite}
.cat-hero h1{font-size:clamp(30px,4.6vw,46px)}
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.lesson{display:flex;flex-direction:column;gap:10px;background:#fff;border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-s);text-align:left;position:relative}
.lesson .l-ico{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:var(--bg)}
.lesson h3{font-size:20px}
.lesson.locked{opacity:.75}
.lesson.locked .lock{position:absolute;top:14px;right:16px;font-size:20px}
.lesson.done .l-ico{background:var(--mint)}
.tip{background:var(--yellow);display:flex;gap:14px;align-items:flex-start}
.tip .t-ico{font-size:34px}

/* Parent */
.gate{max-width:480px;margin:30px auto;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.gate input,.field input{font:inherit;font-weight:800;padding:14px 18px;border-radius:16px;border:3px solid var(--lav);width:100%;max-width:300px;text-align:center;background:#fff;color:var(--ink)}
.field{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field input{text-align:left}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.prow{display:flex;align-items:center;gap:12px}
.prow .char{width:44px;flex:none}
.prow .bar{flex:1}
.prow b{min-width:90px;font-size:15px}
.prow span{font-weight:900;font-size:14px;min-width:42px;text-align:right}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:800;padding:10px 0;border-bottom:2px dashed #eee6f7}
.toggle{width:68px;height:44px;border-radius:99px;background:#d9d1e6;position:relative;transition:.2s;flex:none}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s;box-shadow:var(--shadow-s)}
.toggle[aria-checked="true"]{background:var(--mint-d)}
.toggle[aria-checked="true"]::after{left:32px}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
ul.nice{list-style:none;display:flex;flex-direction:column;gap:10px}
ul.nice li{padding-left:34px;position:relative;font-weight:700;font-size:16px}
ul.nice li::before{content:"🌱";position:absolute;left:0}

/* Responsive */
@media (max-width:900px){
  .hero,.dash,.cat-hero{grid-template-columns:1fr}
  .cat-hero .char{max-width:190px;margin:0 auto}
  .cat-hero{text-align:center}
}
@media (max-width:700px){
  body{font-size:17px}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:60;justify-content:space-around;gap:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.96);border-top:3px dashed rgba(154,130,230,.3);box-shadow:0 -6px 20px rgba(120,90,160,.12)}
  .nav button{display:flex;flex-direction:column;align-items:center;gap:0;font-size:12px;padding:6px 14px;border-radius:18px}
  .nav .ico{display:block}
  .logo span.t{display:none}
  .logo span.t.keep{display:inline}
  .shelf{grid-template-columns:repeat(10,1fr)}
  .toast{bottom:110px}
}

/* ---------- 6. ANIMATIONS ---------- */
@keyframes viewIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(120vw)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.25) rotate(-4deg)}}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(240deg)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="floaties" id="floaties" aria-hidden="true"></div>
<noscript><p style="padding:24px;font:700 20px sans-serif">Little Explorers needs JavaScript. Please turn it on in your browser settings.</p></noscript>

<header class="topbar">
  <a class="logo" href="#/home" aria-label="Little Explorers home" style="text-decoration:none;color:inherit">
    <span class="logo-badge" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 30 30"><path d="M15 2l3.6 8.2 8.9.8-6.7 5.9 2 8.7L15 21l-7.8 4.6 2-8.7L2.5 11l8.9-.8z" fill="#f59a5b"/><circle cx="11" cy="14" r="1.6" fill="#3b2f4a"/><circle cx="19" cy="14" r="1.6" fill="#3b2f4a"/><path d="M12 17.5q3 2.6 6 0" stroke="#3b2f4a" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
    </span>
    <span class="t keep">Little <b>Explor</b><i>ers</i></span>
  </a>
  <div class="spacer"></div>
  <div class="hud">
    <span class="pill" id="hudStars" aria-live="polite">⭐ 0</span>
    <button class="icon-btn" data-action="toggle-music" id="hudMusic" aria-label="Turn background music on" aria-pressed="false" title="Background music">🎵</button>
    <button class="icon-btn" data-action="toggle-sound" id="hudSound" aria-label="Mute sound" aria-pressed="false" title="Sound on / off">🔊</button>
  </div>
  <nav class="nav" id="nav" aria-label="Main">
    <button data-action="go" data-to="home" data-nav="home"><span class="ico">🏠</span>Home</button>
    <button data-action="go" data-to="learn" data-nav="learn"><span class="ico">📚</span>Learn</button>
    <button data-action="go" data-to="play" data-nav="play"><span class="ico">🎮</span>Play</button>
    <button data-action="go" data-to="progress" data-nav="progress"><span class="ico">⭐</span>Progress</button>
    <button data-action="go" data-to="parent" data-nav="parent"><span class="ico">👪</span>Parents</button>
  </nav>
</header>

<main id="app" tabindex="-1"></main>
<footer>Little Explorers · Montessori-inspired learning for ages 4–5 · Progress is saved on this device</footer>
<div class="toast" id="toast" role="status"></div>

<script>
/* =========================================================
   LITTLE EXPLORERS — APPLICATION
   Sections:
   A. Config (categories, characters, messages)
   B. Store (localStorage)
   C. Helpers (sound, speech, confetti, toast)
   D. Components (reusable HTML builders)
   E. Views (home, learn, category, stars, parent)
   F. Router & events
   G. Public API for future learning modules
   ========================================================= */
(function(){
"use strict";

/* ---------- A. CONFIG ---------- */
const CATEGORIES = [
  { id:"alphabet", title:"Alphabet World", teacher:"leo", glyph:"Aa", bg:"var(--peach)", dark:"var(--peach-d)",
    blurb:"Letters A–Z, sounds & words",
    tip:"Montessori children meet letters by their SOUNDS first, and trace them with their fingers.",
    lessons:[ {id:"abc-cards",title:"Alphabet Cards",icon:"🔤"}, {id:"case-match",title:"Big & Little Letters",icon:"🔠"},
              {id:"trace",title:"Trace the Letters",icon:"✍️"}, {id:"letter-pic",title:"Letter & Picture Match",icon:"🍎"},
              {id:"letter-sounds",title:"Listen & Find",icon:"👂"}, {id:"build-word",title:"Build a Word",icon:"🧱"} ] },
  { id:"numbers", title:"Number World", teacher:"ellie", glyph:"123", bg:"var(--lav)", dark:"var(--lav-d)",
    blurb:"Numbers 1–20, counting & adding",
    tip:"Little hands learn best with real things to count: beads, blocks, buttons and pebbles.",
    lessons:[ {id:"number-cards",title:"Number Cards 1–20",icon:"🔢"}, {id:"count-objects",title:"Count the Objects",icon:"🍓"},
              {id:"match-quantity",title:"Match the Quantity",icon:"⚖️"}, {id:"add-it-up",title:"Add It Up",icon:"➕"},
              {id:"pop-balloons",title:"Balloon Pop Counting",icon:"🎈"}, {id:"missing-number",title:"Missing Number",icon:"🚂"} ] },
  { id:"colors", title:"Colors & Shapes", teacher:"bella", glyph:"◐▲", bg:"var(--pink)", dark:"var(--pink-d)",
    blurb:"Rainbow colors & funny shapes",
    tip:"Sorting and matching colors and shapes trains the eyes to notice tiny differences.",
    lessons:[ {id:"meet-colors",title:"Meet the Colors",icon:"🎨"}, {id:"meet-shapes",title:"Meet the Shapes",icon:"🔷"},
              {id:"color-match",title:"Color Match",icon:"🖍️"}, {id:"shape-sort",title:"Shape Sorting",icon:"🗂️"},
              {id:"patterns",title:"Complete the Pattern",icon:"🌈"} ] },
  { id:"animals", title:"Animal Kingdom", teacher:"milo", glyph:"🐾", bg:"var(--blue)", dark:"var(--blue-d)",
    blurb:"Animal names, sounds, babies & homes",
    tip:"Children care for nature when they learn to name and observe the living things around them.",
    lessons:[ {id:"meet-animals",title:"Meet the Animals",icon:"🐮"}, {id:"animal-guess",title:"Guess the Animal",icon:"🦁"}, {id:"animal-sounds",title:"Who Says That?",icon:"🔊"},
              {id:"animal-groups",title:"Animal Groups",icon:"🌍"}, {id:"animal-babies",title:"Animal Babies",icon:"🐣"},

function recordCompletion(k,score){
  const had=!!state.lessons[k]; state.lessons[k]=true;
  const s=state.stats[k]=state.stats[k]||{first:had?null:todayStr(),plays:0,c:0,t:0,best:null};
  s.plays=(s.plays||0)+1; s.last=todayStr();
  if(score&&score.t>0){ const c=Math.max(0,Math.min(score.c,score.t)); s.c=(s.c||0)+c; s.t=(s.t||0)+score.t; const pct=Math.round(c/score.t*100); s.best=s.best==null?pct:Math.max(s.best,pct); }
  save();
  if(!had) addStars(1,null,null,true); else checkBadges();
  return !had;
}

/* ---------- AUDIO ENGINE ----------
   All sounds are made by the browser itself (WebAudio + speech), so there are no sound files.
   NOTHING plays until a child or parent taps something. Music is OFF every time the app opens.
   If a browser has no audio at all, every function below quietly does nothing and the app still works. */
let AC=null, master=null;
function actx(){
  const Ctor=window.AudioContext||window.webkitAudioContext; if(!Ctor) return null;
  try{
    if(!AC){ AC=new Ctor(); master=AC.createGain(); master.gain.value=state.vol; master.connect(AC.destination); }
    if(AC.state==="suspended") AC.resume().catch(()=>{});
    return AC;
  }catch(e){ AC=null; return null; }
}
function setVolume(v){ state.vol=Math.max(.1,Math.min(1,v)); if(master) master.gain.value=state.vol; save(); }
function tone(f,t0,dur,type,vol){
  const c=actx(); if(!c) return;
  const o=c.createOscillator(),g=c.createGain(); o.type=type||"sine"; o.frequency.value=f;
  const t=c.currentTime+t0; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol||.12,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.05);
}
function sfx(kind){
  if(!state.sound) return;
  try{
    if(kind==="ok") [660,880,1175].forEach((f,i)=>tone(f,i*.09,.3,"sine",.13));
    else if(kind==="bad"){ tone(330,0,.18,"triangle",.07); tone(262,.14,.25,"triangle",.07); }   /* soft and low: never harsh */
    else if(kind==="flip") tone(520,0,.08,"square",.03);
    else if(kind==="pop"){ tone(700,0,.1,"sine",.1); tone(990,.07,.12,"sine",.09); }
    else if(kind==="win") [523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.11,.35,"sine",.12));
  }catch(e){}
}
const chime=()=>sfx("ok");
/* animal sounds: one list of tiny "voices" per animal (t=start, d=length, p=pitch path in Hz) */
function voice(o){
  const c=actx(); if(!c) return;
  const t=c.currentTime+(o.t||0), d=o.d||.3, g=c.createGain(); let src;
  if(o.noise){ const len=Math.ceil(c.sampleRate*d), buf=c.createBuffer(1,len,c.sampleRate), dat=buf.getChannelData(0); for(let i=0;i<len;i++) dat[i]=Math.random()*2-1; src=c.createBufferSource(); src.buffer=buf; }
  else{
    src=c.createOscillator(); src.type=o.type||"sine"; const p=o.p||[440]; src.frequency.setValueAtTime(p[0],t);
    p.slice(1).forEach((f,i,arr)=>src.frequency.linearRampToValueAtTime(f,t+d*(i+1)/arr.length));
    if(o.vib){ const l=c.createOscillator(),lg=c.createGain(); l.frequency.value=o.vib[0]; lg.gain.value=o.vib[1]; l.connect(lg); lg.connect(src.frequency); l.start(t); l.stop(t+d+.05); }
  }
  let node=src;
  if(o.lp){ const f=c.createBiquadFilter(); f.type="lowpass"; f.frequency.value=o.lp; node.connect(f); node=f; }
  if(o.bp){ const f=c.createBiquadFilter(); f.type="bandpass"; f.frequency.value=o.bp; f.Q.value=1.2; node.connect(f); node=f; }
  const v=o.v||.12; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+Math.min(.06,d/3)); g.gain.setValueAtTime(v,t+d*.6); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  node.connect(g); g.connect(master); src.start(t); src.stop(t+d+.05);

function musicStart(){
  if(musicOn||!state.sound) return false; const c=actx(); if(!c) return false;
  musicOn=true; mGain=c.createGain(); mGain.gain.setValueAtTime(.0001,c.currentTime); mGain.gain.linearRampToValueAtTime(.55,c.currentTime+2.5); mGain.connect(master);
  mNext=c.currentTime+.15; mStep=0; mTick(); mTimer=setInterval(mTick,400); return true;
}
function musicStop(){
  if(!musicOn) return; musicOn=false; clearInterval(mTimer); mTimer=null;
  const g=mGain; mGain=null;
  if(g&&AC){ try{ g.gain.cancelScheduledValues(AC.currentTime); g.gain.setValueAtTime(Math.max(g.gain.value,.0001),AC.currentTime); g.gain.linearRampToValueAtTime(.0001,AC.currentTime+.4); setTimeout(()=>{try{g.disconnect()}catch(e){}},700); }catch(e){} }
}

/* ---------- F. ROUTER & EVENTS ---------- */
const Modules={};
function route(){
  try{speechSynthesis.cancel()}catch(e){}
  const raw=(location.hash||"#/home").replace(/^#\/?/,"")||"home";
  const [page,a,b]=raw.split("/");
  const app=$("#app"); let html="",navKey=page;
  if(!(page==="learn"&&b)&&page!=="play"){ chain=null; fromPlay=false; }
  if(page==="learn"&&b) html=viewLesson(a,b);
  else if(page==="learn"&&a) html=viewCategory(a);
  else if(page==="learn") html=viewLearn();
  else if(page==="play") html=viewPlay();
  else if(page==="stars"||page==="progress"){ html=viewProgress(); navKey="progress"; }
  else if(page==="parent") html=viewParent();
  else { html=viewHome(); navKey="home"; }
  app.innerHTML=`<div class="view">${html}</div>`;
  $$("#nav button").forEach(btn=>btn.setAttribute("aria-current",btn.dataset.nav===navKey?"page":"false"));
  if(page==="learn"&&b) mountLesson(a,b);
  scrollTo({top:0});
}
function go(to){ const h="#/"+to; if(location.hash===h) route(); else location.hash=h; }
function say(id){
  const ch=CHARACTERS[id]; const line=ch.greet[Math.floor(Math.random()*ch.greet.length)];
  const b=$("#bubble"); if(b) b.textContent=ch.short+": "+line; sfx("pop"); speak(line);
  const btn=$(`.char-btn[data-id="${id}"]`); if(btn){ btn.classList.remove("talk"); void btn.offsetWidth; btn.classList.add("talk"); setTimeout(()=>btn.classList.remove("talk"),1100); }
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-action]"); if(!t||t.disabled) return;
  const act=t.dataset.action, r=t.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/3;
  switch(act){
    case "go": go(t.dataset.to); break;
    case "continue": go(continueTarget()); break;
    case "meet": { const id=t.dataset.id; say(id);
      if(!state.met[id]){ state.met[id]=true; save(); addStars(1,cx,cy);
        const m=t.querySelector(".met"); if(m) m.textContent="⭐"; } else { burst(cx,cy); }
      break; }
    case "adventure": chain=GAMES.map(g=>g.k); fromPlay=true; go("learn/"+chain[0]); break;
    case "play-game": chain=null; fromPlay=true; go("learn/"+t.dataset.k); break;
    case "daily": state.dailyClaimed=todayStr(); save(); addStars(1,cx,cy); route(); break;
    case "toggle-sound": case "set-sound": setSound(!state.sound); if(act==="set-sound") route(); break;
    case "toggle-music": case "set-music": setMusic(!musicOn); if(act==="set-music") route(); break;
    case "test-sound": sfx("win"); break;
    case "set-voice": state.voice=!state.voice; save(); route(); break;
    case "gate": { const v=parseInt($("#gateInput").value,10);
      if(v===gate.a+gate.b){gateOK=true;route();} else {toast("Not quite. Try again!");newGate();route();} break; }
    case "lock": gateOK=false; newGate(); go("home"); break;
    case "save-name": state.name=$("#nameInput").value.trim().slice(0,20); save(); toast(state.name?"Saved! Hello, "+state.name+"!":"Name cleared"); break;
    case "export": { const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="little-explorers-progress.json"; a.click(); break; }
    case "reset": askReset(); break;
  }
});
document.addEventListener("input",e=>{ if(e.target.id==="volInput"){ setVolume(+e.target.value/100); const o=$("#volOut"); if(o) o.textContent=Math.round(state.vol*100)+"%"; } });
document.addEventListener("change",e=>{ if(e.target.id==="volInput") sfx("pop"); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); if(e.key==="Enter"&&e.target.id==="gateInput") $('[data-action="gate"]').click(); if(e.key==="Enter"&&e.target.id==="nameInput") $('[data-action="save-name"]').click(); });
window.addEventListener("hashchange",route);

/* ---------- G. PUBLIC API FOR FUTURE LEARNING MODULES ----------
   Add a module later with:
   LittleExplorers.registerModule("alphabet","letter-sounds",{
     render(container, api){ container.innerHTML="..."; api.complete(3); }
   });

window.LittleExplorers={
  registerModule(catId,lessonId,mod){ Modules[catId+"/"+lessonId]=mod; if(document.readyState!=="loading") route(); },
  categories:CATEGORIES, characters:CHARACTERS, addStars:n=>addStars(n), getState:()=>state, esc, speak, toast, burst, chime, CHAR_ORDER, refresh:()=>route(),
  go, nextKey, chainInfo, backTarget, shower,

<script>
/* =========================================================
   STEP 2 — SHARED LESSON KIT (window.LEKit)

   quiz():   rounds with multiple-choice answers

(function(){
"use strict";
const LE=window.LittleExplorers, esc=LE.esc;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
const rnd=n=>Math.floor(Math.random()*n);
const range=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r};
const canSpeak=()=>{const st=LE.getState();return ("speechSynthesis" in window)&&st.sound&&st.voice};
function hear(text){
  const st=LE.getState();
  if(!("speechSynthesis" in window)){LE.toast("This browser cannot talk, but you can read the words!");return}
  if(!st.sound||!st.voice){LE.toast("Voices are off. A grown-up can turn them on in the Parent page.");return}
  LE.speak(text);
}
function back(){LE.go(LE.backTarget())}
/* ---- feedback, sounds, celebration ---- */
const CHEERS=["Wonderful!","Great Job!","Amazing!","You're Learning!"]; let cheerI=Math.floor(Math.random()*4);
const cheer=()=>CHEERS[cheerI++%CHEERS.length];
const TRY_AGAIN="Let's Try Again!";
const sfx=kind=>LE.audio.sfx(kind);   /* the real sounds live in the core AUDIO ENGINE */
function celebrate(el){
  if(!el||!el.getBoundingClientRect) return LE.burst();
  const r=el.getBoundingClientRect(); LE.burst(r.left+r.width/2,r.top+r.height/2);
}
function chainBar(){
  const ci=LE.chainInfo(); if(!ci) return "";
  return `<div class="le-chain" role="progressbar" aria-valuenow="${ci.i+1}" aria-valuemin="1" aria-valuemax="${ci.n}"><b>🚀 Adventure · Game ${ci.i+1} of ${ci.n}</b><div class="bar"><i style="width:${Math.round((ci.i)/ci.n*100)}%;--c:var(--lav-d)"></i></div></div>`;
}
function shell(host,o){
  host.innerHTML=`<div class="le-lesson">${chainBar()}<div class="le-head"><h2>${o.icon} ${esc(o.title)}</h2><button class="btn small blue" data-h="1">🔊 Listen</button></div>
  <div class="le-instr"><span aria-hidden="true">👉</span><span>${esc(o.instr)}</span></div><div class="le-dots"></div><div class="le-body"></div></div>`;
  host.querySelector("[data-h]").onclick=()=>hear(o.instr);
  return {body:host.querySelector(".le-body"),dots:host.querySelector(".le-dots")};
}
function dots(el,total,cur){el.innerHTML=Array.from({length:total},(_,i)=>`<i class="${i<cur?"on":i===cur?"cur":""}"></i>`).join("")}
function mc(correct,pool,n,fmt){
  const wrong=sample(pool.filter(x=>x!==correct),n-1);
  return shuffle([correct].concat(wrong)).map(x=>({html:fmt(x),ok:x===correct,label:typeof x==="string"?x:""}));
}
function doneScreen(body,api,o){
  const first=api.complete(1,o.score);
  const nk=LE.nextKey(), ci=LE.chainInfo(), parts=(location.hash||"").replace(/^#\/?/,"").split("/");
  const cat=LE.categories.find(c=>c.id===parts[1]), ch=cat&&LE.characters[cat.teacher];
  const lastOfChain=ci&&ci.i===ci.n-1;
  const next=nk?`<button class="btn big" data-a="next">${ci?"Next game":"Next activity"} ➡</button>`:(lastOfChain?`<button class="btn big" data-a="finish">🏆 Finish Adventure</button>`:"");
  body.innerHTML=`<div class="le-done"><div class="dn-stage">${ch?`<div class="dn-char char">${ch.svg()}</div>`:""}<div class="dn-star" aria-hidden="true">⭐</div></div>
    <h2 class="dn-title">${cheer()}</h2>
    <p class="dn-sub">${first?"You earned a star!":"You already have this star. Great practice!"}</p>
    <p style="font-weight:800;font-size:19px;max-width:460px">${esc(o.text||"")}</p>
    <div class="le-actions">${next}<button class="btn mint" data-a="again">🔁 Play again</button><button class="btn blue" data-a="back">⬅ ${ci||LE.backTarget()==="play"?"Game Zone":"More activities"}</button></div></div>`;
  sfx("win"); LE.speak(first?"Wonderful! You earned a star!":"Great job!");
  LE.shower(); LE.burst(innerWidth/2,innerHeight/2); setTimeout(()=>LE.burst(innerWidth*.25,innerHeight*.4),250); setTimeout(()=>LE.burst(innerWidth*.75,innerHeight*.4),450);
  body.querySelector('[data-a="again"]').onclick=o.again; body.querySelector('[data-a="back"]').onclick=back;
  const n=body.querySelector('[data-a="next"]'); if(n) n.onclick=()=>LE.go("learn/"+nk);
  const f=body.querySelector('[data-a="finish"]'); if(f) f.onclick=()=>LE.go("play");
}
function mcDraw(r,body,ctl){
  body.innerHTML=`<div class="le-prompt">${r.prompt||""}${r.ask?`<div class="le-ask">${esc(r.ask)}</div>`:""}
    <div class="le-actions">${r.say?`<button class="btn small ghost" data-s="1">🔊 Hear it</button>`:""}${r.sound?`<button class="btn small peach" data-p="1">🐾 Play the sound</button>`:""}${r.hearOpts?`<button class="btn small ghost" data-o="1">🔊 Hear the choices</button>`:""}</div></div>
    <div class="le-fb" aria-live="polite"></div>
    <div class="le-opts">${r.options.map((op,k)=>`<button class="le-opt${op.txt?" txt":""}" data-k="${k}">${op.html}</button>`).join("")}</div>`;
  const s=body.querySelector("[data-s]"); if(s) s.onclick=()=>hear(r.say);
  const o=body.querySelector("[data-o]"); if(o) o.onclick=()=>hear(r.options.map(x=>x.label||"").join(". "));
  const pl=body.querySelector("[data-p]"); if(pl) pl.onclick=()=>{ if(!LE.audio.animal(r.sound)) hear(r.say||r.sound); };
  if(r.say) setTimeout(()=>{if(body.isConnected) LE.speak(r.say)},350);
  const btns=[].slice.call(body.querySelectorAll(".le-opt"));
  btns.forEach(b=>b.onclick=()=>{
    const op=r.options[+b.dataset.k];
    if(op.ok){btns.forEach(x=>x.disabled=true);b.classList.add("ok");celebrate(b);ctl.right(r.praise,r.praiseSay)}
    else{b.classList.add("bad");b.disabled=true;ctl.wrong()}
  });
}
function rounds(host,api,o){
  function start(){
    const rs=o.make(); let i=0,first=0,tried=false;
    const sh=shell(host,o);
    function fb(msg,bad){const f=sh.body.querySelector(".le-fb"); if(f){f.textContent=msg||"";f.className="le-fb"+(msg?(bad?" bad pop":" good pop"):"")}}
    function show(){
      if(!host.isConnected) return;
      tried=false; dots(sh.dots,rs.length,i);
      const ctl={fb:fb,d:false,
        wrong(msg){tried=true;sfx("bad");fb(TRY_AGAIN+" 💪"+(msg?" "+msg:""),true)},
        right(msg,sp){ if(ctl.d) return; ctl.d=true; if(!tried) first++; const c=cheer(); fb(c+" 🎉"+(msg?" "+msg:"")); sfx("ok"); LE.speak(sp?c+" "+sp:c);
          setTimeout(()=>{ if(!host.isConnected) return; i++; if(i<rs.length) show(); else finish(); },o.delay||1200); }
      };
      o.draw(rs[i],sh.body,ctl,i);
    }
    function finish(){
      dots(sh.dots,rs.length,rs.length);
      doneScreen(sh.body,api,{text:"You got "+first+" of "+rs.length+" right on the first try. "+(first===rs.length?"Perfect! 🌟":"Keep practising!"),score:{c:first,t:rs.length},again:start});
    }
    show();
  }
  start();
}
function quiz(host,api,o){ rounds(host,api,Object.assign({},o,{draw:mcDraw})) }
window.LEKit={shuffle,sample,rnd,range,hear,canSpeak,shell,dots,mc,mcDraw,rounds,quiz,doneScreen,back,esc,sfx,cheer,celebrate,TRY_AGAIN};
})();
</script>
<style>

</style>
<script>
/* ===== ALPHABET WORLD — 6 activities ===== */
(function(){
"use strict";
const LE=window.LittleExplorers,K=window.LEKit,esc=LE.esc;
const LETTERS="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const A=[["A","Apple","🍎"],["B","Ball","⚽"],["C","Cat","🐱"],["D","Dog","🐶"],["E","Elephant","🐘"],["F","Fish","🐟"],["G","Grapes","🍇"],["H","Hat","🎩"],["I","Ice cream","🍦"],["J","Juice","🧃"],["K","Kite","🪁"],["L","Lion","🦁"],["M","Moon","🌙"],["N","Nose","👃"],["O","Orange","🍊"],["P","Pizza","🍕"],["Q","Queen","👑"],["R","Rainbow","🌈"],["S","Sun","☀️"],["T","Tree","🌳"],["U","Umbrella","☂️"],["V","Violin","🎻"],["W","Whale","🐳"],["X","X-ray","🩻"],["Y","Yo-yo","🪀"],["Z","Zebra","🦓"]];
const COLS=["var(--peach)","var(--blue)","var(--pink)","var(--mint)","var(--lav)","var(--yellow)"];
const PH={A:"ah",B:"buh",C:"kuh",D:"duh",E:"eh",F:"fff",G:"guh",H:"huh",I:"ih",J:"juh",K:"kuh",L:"lll",M:"mmm",N:"nnn",O:"oh",P:"puh",Q:"kwuh",R:"rrr",S:"sss",T:"tuh",U:"uh",V:"vvv",W:"wuh",X:"ks",Y:"yuh",Z:"zzz"};
const say=(L,w)=>L+". "+(PH[L]?PH[L]+". ":"")+L+" is for "+w;   /* letter name, then its sound, then the word */
const speakLetter=i=>LE.speak(say(A[i][0],A[i][1]));

/* 1. Alphabet Cards */
LE.registerModule("alphabet","abc-cards",{render(host,api){
  const sh=K.shell(host,{icon:"🔤",title:"Alphabet Cards",instr:"Tap a letter to see its card and hear it. Visit 10 letters to finish!"});
  sh.dots.style.display="none";
  let i=0,done=false; const seen=new Set([0]);
  function draw(){
    const [L,w,e]=A[i];
    sh.body.innerHTML=`<div class="ab-card" style="background:${COLS[i%6]}"><div class="ab-letters"><span>${L}</span><span>${L.toLowerCase()}</span></div>
      <div class="ab-pic">${e}</div><div class="ab-word"><b>${L}</b> for ${esc(w)}</div></div>
      <div class="le-actions"><button class="btn small ghost" data-a="p">◀ Back</button><button class="btn blue" data-a="h">🔊 Listen</button><button class="btn small ghost" data-a="n">Next ▶</button></div>
      <p class="le-fb">${seen.size} letters visited${seen.size>=10?" ⭐":" (visit 10)"}</p>
      <div class="ab-grid">${A.map((x,k)=>`<button class="ab-k ${seen.has(k)?"seen":""} ${k===i?"cur":""}" data-i="${k}">${x[0]}</button>`).join("")}</div>`;
    sh.body.querySelector('[data-a="p"]').onclick=()=>go(i-1);
    sh.body.querySelector('[data-a="n"]').onclick=()=>go(i+1);
    sh.body.querySelector('[data-a="h"]').onclick=()=>K.hear(say(L,w));
    sh.body.querySelectorAll(".ab-k").forEach(b=>b.onclick=()=>go(+b.dataset.i));
  }
  function go(k){ i=(k+26)%26; seen.add(i); draw(); speakLetter(i); if(!done&&seen.size>=10){done=true;api.complete(3)} }
  draw();
}});

/* 2. Big & Little Letters */
LE.registerModule("alphabet","case-match",{render(host,api){
  K.quiz(host,api,{icon:"🔠",title:"Big & Little Letters",instr:"Find the little letter that matches the big letter.",
    make:()=>K.sample(LETTERS,10).map(L=>({prompt:`<div class="le-big">${L}</div>`,ask:"Which little letter matches "+L+"?",say:"Find the little letter that matches "+L,
      praise:"Yes! "+L+" and "+L.toLowerCase()+" 🎉",options:K.mc(L,LETTERS,4,x=>x.toLowerCase())}))});
}});

/* 3. Trace the Letters (mouse + touch) */
LE.registerModule("alphabet","trace",{render(host,api){
  const sh=K.shell(host,{icon:"✍️",title:"Trace the Letters",instr:"Trace the gray letter with your finger or mouse. Then press Check!"});
  sh.dots.style.display="none";
  let idx=0,lower=false,passes=0,got=false,drawing=false,last=null,busy=false; const okSet=new Set();
  sh.body.innerHTML=`<div class="tr-wrap"><div class="tr-top"><button class="btn small ghost" data-a="prev" aria-label="Previous letter">◀</button><b data-n></b><button class="btn small ghost" data-a="next" aria-label="Next letter">▶</button></div>
    <div class="tr-box"><canvas data-g width="480" height="480"></canvas><canvas data-d width="480" height="480"></canvas></div>
    <div class="le-fb" data-f></div>
    <div class="le-actions"><button class="btn small blue" data-a="hear">🔊 Hear</button><button class="btn small ghost" data-a="case">Aa Switch</button><button class="btn small ghost" data-a="clear">🧽 Clear</button><button class="btn mint small" data-a="check">✅ Check</button></div>
    <div class="tr-strip"></div></div>`;
  const $=s=>sh.body.querySelector(s);
  const g=$("[data-g]"),d=$("[data-d]"),gx=g.getContext("2d"),dx=d.getContext("2d");
  const FONT="900 340px 'Arial Rounded MT Bold','Trebuchet MS',Arial,sans-serif";
  const ch=()=>lower?LETTERS[idx].toLowerCase():LETTERS[idx];
  function baseY(ctx,t){ctx.font=FONT;ctx.textAlign="center";ctx.textBaseline="alphabetic";const m=ctx.measureText(t);return 240+((m.actualBoundingBoxAscent||250)-(m.actualBoundingBoxDescent||0))/2}
  function guide(){
    const t=ch(),y=baseY(gx,t); gx.clearRect(0,0,480,480); gx.fillStyle="#efe8fb"; gx.fillText(t,240,y);
    gx.setLineDash([10,10]); gx.lineWidth=4; gx.strokeStyle="#b39ddb"; gx.strokeText(t,240,y); gx.setLineDash([]);
    dx.clearRect(0,0,480,480);
    $("[data-n]").textContent=LETTERS[idx]+" "+LETTERS[idx].toLowerCase();
    $("[data-f]").textContent=""; strip();
  }
  function strip(){ const s=$(".tr-strip"); s.innerHTML=LETTERS.map((L,k)=>`<button class="${okSet.has(k)?"ok":""} ${k===idx?"cur":""}" data-i="${k}">${L}</button>`).join("");
    s.querySelectorAll("button").forEach(b=>b.onclick=()=>{idx=+b.dataset.i;guide()}); }
  const pos=e=>{const r=d.getBoundingClientRect();return{x:(e.clientX-r.left)*480/r.width,y:(e.clientY-r.top)*480/r.height}};
  function pen(){dx.lineCap="round";dx.lineJoin="round";dx.lineWidth=46;dx.strokeStyle="#ff8a65";dx.fillStyle="#ff8a65"}
  d.addEventListener("pointerdown",e=>{drawing=true;last=pos(e);pen();dx.beginPath();dx.arc(last.x,last.y,23,0,7);dx.fill();try{d.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
  d.addEventListener("pointermove",e=>{if(!drawing)return;const p=pos(e);pen();dx.beginPath();dx.moveTo(last.x,last.y);dx.lineTo(p.x,p.y);dx.stroke();last=p;e.preventDefault()});
  ["pointerup","pointercancel","pointerleave"].forEach(t=>d.addEventListener(t,()=>{drawing=false}));
  function check(){
    if(busy) return;
    const m=document.createElement("canvas"); m.width=m.height=480; const mx=m.getContext("2d"); const t=ch(); const y=baseY(mx,t); mx.fillStyle="#000"; mx.fillText(t,240,y);
    const a=mx.getImageData(0,0,480,480).data,b=dx.getImageData(0,0,480,480).data;
    let tot=0,hit=0,out=0;
    for(let p=3;p<a.length;p+=16){const inM=a[p]>128,dr=b[p]>40; if(inM){tot++;if(dr)hit++}else if(dr)out++}
    const f=$("[data-f]");
    if(hit+out<20){f.textContent="Use your finger to trace the gray letter!";return}
    if(hit/tot<0.55){f.textContent="Almost! Trace over more of the gray letter.";return}
    if(out>tot*0.9){f.textContent="Nice try! Stay inside the gray letter.";return}
    busy=true; passes++; okSet.add(idx); f.textContent="Beautiful tracing! ⭐"; LE.chime(); LE.speak("Beautiful! "+LETTERS[idx]); strip();
    if(passes>=3&&!got){got=true;api.complete(3)}
    setTimeout(()=>{busy=false; if(host.isConnected){idx=(idx+1)%26;guide()}},1500);
  }
  $('[data-a="prev"]').onclick=()=>{idx=(idx+25)%26;guide()};
  $('[data-a="next"]').onclick=()=>{idx=(idx+1)%26;guide()};
  $('[data-a="hear"]').onclick=()=>K.hear(say(LETTERS[idx],A[idx][1]));
  $('[data-a="case"]').onclick=()=>{lower=!lower;guide()};
  $('[data-a="clear"]').onclick=()=>{dx.clearRect(0,0,480,480);$("[data-f]").textContent=""};
  $('[data-a="check"]').onclick=check;
  guide();
}});

/* 4. Letter & Picture Match */
LE.registerModule("alphabet","letter-pic",{render(host,api){
  K.quiz(host,api,{icon:"🍎",title:"Letter & Picture Match",instr:"Look at the picture. Tap the letter its name starts with.",
    make:()=>K.sample(A,10).map(([L,w,e])=>({prompt:`<div class="le-big">${e}</div>`,ask:"Which letter does "+w.toLowerCase()+" start with?",say:"Which letter does "+w+" start with?",
      praise:L+" is for "+w+"! 🎉",praiseSay:L+" is for "+w,options:K.mc(L,LETTERS,4,x=>x)}))});
}});

/* 5. Listen & Find (letter pronunciation) */
LE.registerModule("alphabet","letter-sounds",{render(host,api){
  K.quiz(host,api,{icon:"👂",title:"Listen & Find",instr:"Press the speaker and listen. Then tap the letter you hear!",
    make:()=>K.sample(LETTERS,10).map(L=>({prompt:`<div class="le-big">🔊</div>`,ask:K.canSpeak()?"Listen. Which letter do you hear?":"Find the letter "+L,say:"Find the letter "+L,
      praise:"Yes, that is "+L+"! 🎉",options:K.mc(L,LETTERS,4,x=>x)}))});
}});

/* 6. Build a Word */
LE.registerModule("alphabet","build-word",{render(host,api){
  const W=[["cat","🐱"],["dog","🐶"],["sun","☀️"],["hat","🎩"],["bus","🚌"],["pig","🐷"],["cup","☕"],["bed","🛏️"],["fox","🦊"],["bee","🐝"],["car","🚗"],["egg","🥚"],["fish","🐟"],["frog","🐸"]];
  K.rounds(host,api,{icon:"🧱",title:"Build a Word",instr:"Look at the picture. Tap the letters in order to spell the word.",
    make:()=>K.sample(W,6).map(([w,e])=>({w:w,e:e})),
    draw(r,body,ctl){
      const w=r.w.toUpperCase(); let pos=0;
      const extras=K.sample(LETTERS.filter(c=>w.indexOf(c)<0),2), tiles=K.shuffle(w.split("").concat(extras));
      body.innerHTML=`<div class="le-prompt"><div class="le-big">${r.e}</div><div class="le-ask">Spell the word!</div><button class="btn small ghost" data-s="1">🔊 Hear it</button></div>
        <div class="bw-slots">${w.split("").map(()=>`<span class="bw-slot"></span>`).join("")}</div><div class="le-fb"></div>
        <div class="le-opts">${tiles.map((t,k)=>`<button class="le-opt" data-k="${k}">${t}</button>`).join("")}</div>`;
      body.querySelector("[data-s]").onclick=()=>K.hear(r.w);
      setTimeout(()=>{if(body.isConnected)LE.speak("Spell "+r.w)},300);
      const slots=body.querySelectorAll(".bw-slot");
      body.querySelectorAll(".le-opt").forEach(b=>b.onclick=()=>{
        const t=tiles[+b.dataset.k];
        if(pos<w.length&&t===w[pos]){slots[pos].textContent=t;slots[pos].classList.add("on");pos++;b.disabled=true;b.classList.add("ok");LE.speak(t.toLowerCase());
          if(pos===w.length) ctl.right(r.w.toUpperCase()+"! Great spelling! 🎉",r.w);}
        else{b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),450);ctl.wrong("Try another letter!")}
      });
    }});
}});
})();
</script>

<script>
/* ===== NUMBER WORLD — 6 activities ===== */
(function(){
"use strict";
const LE=window.LittleExplorers,K=window.LEKit;
const W=["one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen","twenty"];
const OBJ=["🍎","🍓","🐟","🌟","🐤","🎈","🚗","🌼","🍪","🐞"];
const near=(n,lo,hi)=>{const s=new Set([n]);const c=K.shuffle(K.range(Math.max(lo,n-4),Math.min(hi,n+4)).filter(x=>x!==n));c.slice(0,3).forEach(x=>s.add(x));return K.shuffle([...s])};
const numOpts=(n,lo,hi)=>near(n,lo,hi).map(x=>({html:String(x),ok:x===n}));

/* 1. Number Cards 1-20 */
LE.registerModule("numbers","number-cards",{render(host,api){
  const sh=K.shell(host,{icon:"🔢",title:"Number Cards 1–20",instr:"Tap a number. Count the dots and listen to its name. Visit 10 numbers to finish!"});
  sh.dots.style.display="none";
  let cur=1,done=false; const seen=new Set([1]);
  function dotsHTML(n){let h="";for(let k=1;k<=n;k++){h+=`<span class="nm-dot" style="background:${k<=10?"var(--blue-d)":"var(--pink-d)"};animation-delay:${k*30}ms"></span>`;if(k%5===0&&k<n)h+=`<span class="nm-br"></span>`}return h}
  function draw(){
    sh.body.innerHTML=`<div class="nm-card"><div class="nm-num">${cur}</div><div class="nm-word">${W[cur-1]}</div><div class="nm-dots">${dotsHTML(cur)}</div></div>
      <div class="le-actions"><button class="btn small ghost" data-a="p">◀ Back</button><button class="btn blue" data-a="h">🔊 Listen</button><button class="btn small ghost" data-a="n">Next ▶</button></div>
      <p class="le-fb">${seen.size} numbers visited${seen.size>=10?" ⭐":" (visit 10)"}</p>
      <div class="nm-grid">${K.range(1,20).map(k=>`<button class="nm-k ${seen.has(k)?"seen":""} ${k===cur?"cur":""}" data-i="${k}">${k}</button>`).join("")}</div>`;
    sh.body.querySelector('[data-a="p"]').onclick=()=>go(cur===1?20:cur-1);
    sh.body.querySelector('[data-a="n"]').onclick=()=>go(cur===20?1:cur+1);
    sh.body.querySelector('[data-a="h"]').onclick=()=>K.hear(cur+". "+W[cur-1]);
    sh.body.querySelectorAll(".nm-k").forEach(b=>b.onclick=()=>go(+b.dataset.i));
  }
  function go(n){cur=n;seen.add(n);draw();LE.speak(n+". "+W[n-1]);if(!done&&seen.size>=10){done=true;api.complete(3)}}
  draw();
}});

/* 2. Count the Objects (tap each one to count) */
LE.registerModule("numbers","count-objects",{render(host,api){
  K.rounds(host,api,{icon:"🍓",title:"Count the Objects",instr:"Tap each object to count it. Then pick how many there are.",
    make:()=>[3,5,7,4,9,6,12,8,15,11,14,18].sort(()=>Math.random()-.5).slice(0,8).sort((a,b)=>a-b).map(n=>({n:n,e:OBJ[K.rnd(OBJ.length)]})),
    draw(r,body,ctl){
      K.mcDraw({prompt:`<div class="cnt-grid">${Array.from({length:r.n},()=>`<button class="cnt">${r.e}</button>`).join("")}</div>`,ask:"How many are there?",
        say:"Tap each one to count. How many are there?",praise:r.n+" "+(r.n===1?"is":"are")+" "+W[r.n-1]+"! 🎉",praiseSay:r.n+". "+W[r.n-1],options:numOpts(r.n,1,20)},body,ctl);
      let c=0;
      body.querySelectorAll(".cnt").forEach(b=>b.onclick=()=>{ if(b.dataset.c) return; c++; b.dataset.c=c; b.classList.add("on"); b.insertAdjacentHTML("beforeend",`<span class="cnt-n">${c}</span>`); LE.speak(String(c)); });
    }});
}});

/* 3. Match the Quantity */
LE.registerModule("numbers","match-quantity",{render(host,api){
  K.quiz(host,api,{icon:"⚖️",title:"Match the Quantity",instr:"Look at the number. Tap the group that has that many things.",
    make:()=>K.sample(K.range(1,10),8).map(n=>{const e=OBJ[K.rnd(OBJ.length)];
      return {prompt:`<div class="le-big">${n}</div>`,ask:"Which group has "+n+"?",say:"Which group has "+W[n-1]+"?",praise:"Yes! "+n+" "+e+" 🎉",praiseSay:"Yes! "+W[n-1],
        options:near(n,1,10).map(x=>({html:`<span class="grp">${e.repeat(x)}</span>`,ok:x===n}))}})});
}});

/* 4. Add It Up (within 10) */
LE.registerModule("numbers","add-it-up",{render(host,api){
  K.quiz(host,api,{icon:"➕",title:"Add It Up",instr:"Count both groups together. How many altogether?",
    make:()=>Array.from({length:8},()=>{const a=1+K.rnd(7),b=1+K.rnd(Math.min(8,10-a)),e=OBJ[K.rnd(OBJ.length)];
      return {prompt:`<div class="add-row"><span>${e.repeat(a)}</span><b>+</b><span>${e.repeat(b)}</span><b>=</b><b>?</b></div><div class="le-big" style="font-size:56px">${a} + ${b} = ?</div>`,
        ask:"How many altogether?",say:a+" plus "+b+". How many altogether?",praise:a+" + "+b+" = "+(a+b)+" 🎉",praiseSay:a+" plus "+b+" equals "+(a+b),options:numOpts(a+b,1,10)}})});
}});

/* 5. Balloon Pop Counting */
LE.registerModule("numbers","pop-balloons",{render(host,api){
  const COLORS=["🎈","🎈","🎈","🎈"];
  K.rounds(host,api,{icon:"🎈",title:"Balloon Pop Counting",instr:"Pop exactly the number of balloons you are asked for. Count out loud!",delay:1400,
    make:()=>K.sample(K.range(2,10),6).map(n=>({n:n})),
    draw(r,body,ctl){
      let popped=0,locked=false;
      body.innerHTML=`<div class="le-prompt"><div class="le-big">${r.n}</div><div class="le-ask">Pop exactly ${r.n} balloons!</div><button class="btn small ghost" data-s="1">🔊 Hear it</button></div>
        <div class="le-fb"><span class="cnt-badge">Popped: <b data-c>0</b></span></div><div class="bl-grid">${Array.from({length:12},()=>`<button class="bl">🎈</button>`).join("")}</div>
        <div class="le-actions"><button class="btn small ghost" data-a="reset">🔄 Start again</button></div>`;
      body.querySelector("[data-s]").onclick=()=>K.hear("Pop exactly "+W[r.n-1]+" balloons");
      setTimeout(()=>{if(body.isConnected)LE.speak("Pop exactly "+W[r.n-1]+" balloons")},300);
      const cnt=body.querySelector("[data-c]"),bs=body.querySelectorAll(".bl");
      const reset=()=>{if(locked&&popped===r.n)return;popped=0;locked=false;cnt.textContent="0";bs.forEach(b=>{b.textContent="🎈";b.disabled=false})};
      body.querySelector('[data-a="reset"]').onclick=reset;
      bs.forEach(b=>b.onclick=()=>{ if(locked) return; popped++; b.textContent="💥"; b.disabled=true; cnt.textContent=popped; LE.speak(String(popped));
        if(popped===r.n){locked=true;ctl.right("You popped "+r.n+"! 🎉",W[r.n-1]+"! Well done")}
        else if(popped>r.n){locked=true;ctl.wrong("Oops, too many! Let's try again.");setTimeout(()=>{locked=false;popped=0;cnt.textContent="0";bs.forEach(x=>{x.textContent="🎈";x.disabled=false})},1100)} });
    }});
}});

/* 6. Missing Number */
LE.registerModule("numbers","missing-number",{render(host,api){
  K.quiz(host,api,{icon:"🚂",title:"Missing Number",instr:"One number fell off the train! Which number is missing?",
    make:()=>Array.from({length:8},()=>{const s=1+K.rnd(15),h=1+K.rnd(3),n=s+h;
      const cars=K.range(s,s+4).map((x,k)=>k===h?`<span class="q">?</span>`:`<span>${x}</span>`).join("");
      return {prompt:`<div class="le-big" style="font-size:44px">🚂</div><div class="seq">${cars}</div>`,ask:"Which number is missing?",say:"Which number is missing from the train?",
        praise:n+" was missing! 🎉",praiseSay:n,options:numOpts(n,1,20)}})});
}});
})();
</script>
<style>
/* ===== COLORS & SHAPES ===== */
.cs-feature{border-radius:var(--radius);padding:20px;text-align:center;background:var(--cream);display:flex;flex-direction:column;align-items:center;gap:8px}

.pat span.q{background:var(--yellow);border:4px dashed var(--yellow-d);font-weight:900}

<script>
/* ===== COLORS & SHAPES — 5 activities ===== */
(function(){
"use strict";
const LE=window.LittleExplorers,K=window.LEKit;
const COLORS=[
 {n:"Red",h:"#ef5350",e:"🍎",o:"an apple"},{n:"Blue",h:"#42a5f5",e:"🐳",o:"a whale"},{n:"Yellow",h:"#ffd54f",e:"🍌",o:"a banana"},{n:"Green",h:"#66bb6a",e:"🐸",o:"a frog"},
 {n:"Orange",h:"#ffa726",e:"🍊",o:"an orange"},{n:"Purple",h:"#ab7df0",e:"🍇",o:"grapes"},{n:"Pink",h:"#f48fb1",e:"🐷",o:"a pig"},{n:"Brown",h:"#8d6e63",e:"🐻",o:"a bear"}];
const SHAPES=[
 {n:"Circle",f:"It is round with no corners.",s:'<circle cx="50" cy="50" r="40"/>'},
 {n:"Square",f:"It has 4 equal sides and 4 corners.",s:'<rect x="14" y="14" width="72" height="72" rx="6"/>'},
 {n:"Triangle",f:"It has 3 sides and 3 corners.",s:'<polygon points="50,10 92,86 8,86" stroke-linejoin="round"/>'},
 {n:"Rectangle",f:"It has 4 sides. Two are long and two are short.",s:'<rect x="8" y="26" width="84" height="48" rx="6"/>'},
 {n:"Star",f:"It has 5 points.",s:'<polygon points="50,6 61,38 95,38 67,58 78,92 50,71 22,92 33,58 5,38 39,38" stroke-linejoin="round"/>'},
 {n:"Oval",f:"It is like a squashed circle.",s:'<ellipse cx="50" cy="50" rx="44" ry="28"/>'},
 {n:"Heart",f:"It looks like a heart. We use it to say love!",s:'<path d="M50 88 C10 56 6 30 26 18 C40 10 50 22 50 30 C50 22 60 10 74 18 C94 30 90 56 50 88Z"/>'}];
const SHCOL=["#ef5350","#42a5f5","#ffca28","#66bb6a","#ab7df0","#ffa726","#f48fb1"];
LE.shapeKit={SHAPES:SHAPES,SHCOL:SHCOL};
const svg=(sh,fill,cls,stroke)=>`<svg class="${cls||"shp"}" viewBox="0 0 100 100" aria-label="${sh.n}" fill="${fill}" stroke="${stroke||"none"}" stroke-width="${stroke?4:0}">${sh.s}</svg>`;
const swatch=(c,cls)=>`<div class="sw ${cls||""}" style="background:${c.h}" role="img" aria-label="${c.n}"></div>`;

/* 1. Meet the Colors */
LE.registerModule("colors","meet-colors",{render(host,api){
  const sh=K.shell(host,{icon:"🎨",title:"Meet the Colors",instr:"Tap each color to hear its name. Meet all 8 colors to finish!"}); sh.dots.style.display="none";
  let cur=0,done=false; const seen=new Set();
  function draw(){
    const c=COLORS[cur];
    sh.body.innerHTML=`<div class="cs-feature"><div class="sw cs-big" style="background:${c.h}"></div><div class="cs-name" style="color:${c.h}">${c.n}</div><div style="font-weight:800;font-size:20px">${c.n} like ${c.o} <span style="font-size:36px">${c.e}</span></div>
      <button class="btn blue small" data-a="h">🔊 Listen</button></div><p class="le-fb">${seen.size} of 8 colors met${seen.size>=8?" ⭐":""}</p>
      <div class="cs-grid">${COLORS.map((x,k)=>`<button class="cs-k ${seen.has(k)?"seen":""} ${k===cur?"cur":""}" data-i="${k}">${swatch(x)}${x.n}</button>`).join("")}</div>`;
    sh.body.querySelector('[data-a="h"]').onclick=()=>K.hear(c.n+". "+c.n+" like "+c.o);
    sh.body.querySelectorAll(".cs-k").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;seen.add(cur);draw();LE.speak(COLORS[cur].n+". "+COLORS[cur].n+" like "+COLORS[cur].o);if(!done&&seen.size>=8){done=true;api.complete(3)}});
  }
  draw();
}});

/* 2. Meet the Shapes */
LE.registerModule("colors","meet-shapes",{render(host,api){
  const sh=K.shell(host,{icon:"🔷",title:"Meet the Shapes",instr:"Tap each shape to learn its name. Meet all 7 shapes to finish!"}); sh.dots.style.display="none";
  let cur=0,done=false; const seen=new Set();
  function draw(){
    const s=SHAPES[cur];
    sh.body.innerHTML=`<div class="cs-feature">${svg(s,SHCOL[cur],"cs-big")}<div class="cs-name">${s.n}</div><div style="font-weight:800;font-size:20px">${s.f}</div>
      <button class="btn blue small" data-a="h">🔊 Listen</button></div><p class="le-fb">${seen.size} of 7 shapes met${seen.size>=7?" ⭐":""}</p>
      <div class="cs-grid">${SHAPES.map((x,k)=>`<button class="cs-k ${seen.has(k)?"seen":""} ${k===cur?"cur":""}" data-i="${k}">${svg(x,SHCOL[k])}${x.n}</button>`).join("")}</div>`;
    sh.body.querySelector('[data-a="h"]').onclick=()=>K.hear(s.n+". "+s.f);
    sh.body.querySelectorAll(".cs-k").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;seen.add(cur);draw();LE.speak(SHAPES[cur].n+". "+SHAPES[cur].f);if(!done&&seen.size>=7){done=true;api.complete(3)}});
  }
  draw();
}});

/* 3. Color Match */
LE.registerModule("colors","color-match",{render(host,api){
  K.quiz(host,api,{icon:"🖍️",title:"Color Match",instr:"Listen to the question. Tap the right color!",
    make:()=>{
      const a=K.sample(COLORS,4).map(c=>({prompt:`<div class="le-big" style="font-size:60px;color:${c.h}">${c.n}</div>`,ask:"Find the color "+c.n.toLowerCase()+"!",say:"Find the color "+c.n,
        praise:"Yes, that is "+c.n.toLowerCase()+"! 🎉",praiseSay:c.n+"!",options:K.mc(c,COLORS,4,x=>swatch(x,"lg"))}));
      const b=K.sample(COLORS,4).map(c=>({prompt:`<div class="le-big">${c.e}</div>`,ask:"What color is "+c.o+"?",say:"What color is "+c.o+"?",
        praise:c.o.charAt(0).toUpperCase()+c.o.slice(1)+" is "+c.n.toLowerCase()+"! 🎉",praiseSay:c.n,options:K.mc(c,COLORS,4,x=>swatch(x,"lg"))}));
      return K.shuffle(a.concat(b));
    }});
}});

/* 4. Shape Sorting: see the drag-and-drop version in the Games section */

/* 5. Complete the Pattern */
LE.registerModule("colors","patterns",{render(host,api){
  const CIRC=["🔴","🔵","🟡","🟢","🟣","🟠"],SHAPE=["⭐","❤️","🔺","🔷","🌙","🍀"];
  const TEMPL=[[0,1],[0,0,1],[0,1,1],[0,1,2]];
  K.quiz(host,api,{icon:"🌈",title:"Complete the Pattern",instr:"Look at the pattern. Which one comes next?",
    make:()=>Array.from({length:8},()=>{
      const pool=Math.random()<.5?CIRC:SHAPE, t=TEMPL[K.rnd(TEMPL.length)], items=K.sample(pool,3);
      const seq=[];for(let i=0;i<6;i++)seq.push(items[t[i%t.length]]);
      const ans=seq[5], shown=seq.slice(0,5);
      return {prompt:`<div class="pat">${shown.map(x=>`<span>${x}</span>`).join("")}<span class="q">?</span></div>`,ask:"What comes next?",say:"Look at the pattern. What comes next?",
        praise:"Great pattern thinking! 🎉",options:K.mc(ans,pool,4,x=>x)}})});
}});
})();
</script>

<script>
/* ===== ANIMAL KINGDOM — 5 activities ===== */
(function(){
"use strict";
const LE=window.LittleExplorers,K=window.LEKit;
const G={farm:{t:"Farm",e:"🚜"},wild:{t:"Wild",e:"🦁"},birds:{t:"Birds",e:"🐦"},sea:{t:"Sea",e:"🌊"},insects:{t:"Insects",e:"🐝"}};
const ANIMALS=[
 ["Cow","🐄","moo","farm"],["Pig","🐖","oink","farm"],["Sheep","🐑","baa","farm"],["Horse","🐴","neigh","farm"],["Dog","🐕","woof","farm"],["Cat","🐈","meow","farm"],
 ["Lion","🦁","roar","wild"],["Elephant","🐘","toot toot","wild"],["Monkey","🐒","ooh ooh","wild"],["Tiger","🐯","grr","wild"],["Wolf","🐺","howl","wild"],["Zebra","🦓","neigh","wild"],
 ["Owl","🦉","hoot","birds"],["Parrot","🦜","squawk","birds"],["Duck","🦆","quack","birds"],["Chicken","🐔","cluck","birds"],["Swan","🦢","honk","birds"],["Dove","🕊️","coo","birds"],
 ["Whale","🐳","whoosh","sea"],["Dolphin","🐬","click click","sea"],["Fish","🐟","blub blub","sea"],["Crab","🦀","click clack","sea"],["Seal","🦭","arf arf","sea"],["Shark","🦈","gulp","sea"],
 ["Bee","🐝","buzz","insects"],["Butterfly","🦋","flutter flutter","insects"],["Ant","🐜","tap tap","insects"],["Ladybug","🐞","tick tick","insects"],["Cricket","🦗","chirp","insects"],["Caterpillar","🐛","munch munch","insects"]];
LE.animalData=ANIMALS;
const art=n=>/^[AEIOU]/.test(n)?"An":"A";
const line=a=>art(a[0])+" "+a[0].toLowerCase()+" says "+a[2]+"!";

/* 1. Meet the Animals */
LE.registerModule("animals","meet-animals",{render(host,api){
  const sh=K.shell(host,{icon:"🐮",title:"Meet the Animals",instr:"Pick a group. Tap an animal to hear its name and its sound. Meet 10 animals to finish!"}); sh.dots.style.display="none";
  let grp="farm",cur=ANIMALS[0],done=false; const seen=new Set();
  function draw(){
    const list=ANIMALS.filter(a=>a[3]===grp);
    sh.body.innerHTML=`<div class="an-tabs">${Object.keys(G).map(k=>`<button class="${k===grp?"cur":""}" data-g="${k}">${G[k].e} ${G[k].t}</button>`).join("")}</div>
      <div class="an-feature"><div class="an-emoji">${cur[1]}</div><div class="an-name">${cur[0]}</div><div style="font-weight:800;font-size:20px">${line(cur)}</div><div class="snd">${cur[2].toUpperCase()}!</div>
      <button class="btn small ghost" data-a="h">🔊 Listen</button> <button class="btn small peach" data-a="snd">🐾 Hear the sound</button></div><p class="le-fb">${seen.size} animals met${seen.size>=10?" ⭐":" (meet 10)"}</p>
      <div class="an-grid">${list.map((a,k)=>`<button class="an-k ${seen.has(a[0])?"seen":""} ${a===cur?"cur":""}" data-i="${k}">${a[1]}<small>${a[0]}</small></button>`).join("")}</div>`;
    sh.body.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{grp=b.dataset.g;cur=ANIMALS.filter(a=>a[3]===grp)[0];draw()});
    sh.body.querySelector('[data-a="h"]').onclick=()=>K.hear(cur[0]+". "+line(cur));
    sh.body.querySelector('[data-a="snd"]').onclick=()=>{ if(!LE.audio.animal(cur[0])) K.hear(line(cur)); };
    sh.body.querySelectorAll(".an-k").forEach(b=>b.onclick=()=>{cur=list[+b.dataset.i];seen.add(cur[0]);draw();const d=LE.audio.animal(cur[0]);setTimeout(()=>LE.speak(cur[0]+". "+line(cur)),d?Math.min(d*1000,1200):0);if(!done&&seen.size>=10){done=true;api.complete(3)}});
  }

<script>
/* =========================================================
   STEP 3 — GAME ENGINES
   sorter():   drag-and-drop (mouse + touch) with a tap-to-select alternative
   sequence(): put the steps in the right order
   ========================================================= */
(function(){
"use strict";
const LE=window.LittleExplorers,K=window.LEKit,esc=LE.esc;
const HINT="👆 Drag each one to its place, or tap it and then tap the place.";

function sorter(host,api,o){
  K.rounds(host,api,Object.assign({},o,{draw(r,body,ctl){
    const items=r.items; let left=items.length, sel=null, lastDrag=0, drag=null;
    body.innerHTML=`${r.ask?`<div class="le-ask" style="text-align:center">${esc(r.ask)}</div>`:""}
      <div class="sr-scene ${r.cls||""}">${r.bins.map(b=>`<div class="sr-bin" data-b="${esc(b.id)}" data-cap="${b.cap||((r.cls||"").indexOf("free")>=0?1:99)}" style="${b.style||""}" role="button" tabindex="0" aria-label="${esc(b.label||b.id)}"><div class="sr-bin-h">${b.html}</div><div class="sr-bin-l">${esc(b.label||"")}</div><div class="sr-in"></div></div>`).join("")}</div>
      <div class="le-fb" aria-live="polite"></div>
      <div class="sr-tray">${items.map((it,k)=>`<button class="sr-item" data-k="${k}" aria-label="${esc(it.label||"piece")}">${it.html}</button>`).join("")}</div>
      <p class="sr-hint">${HINT}</p>`;
    const scene=body.querySelector(".sr-scene"), tray=body.querySelector(".sr-tray"), hint=body.querySelector(".sr-hint");
    const bins=[].slice.call(body.querySelectorAll(".sr-bin"));
    function deselect(){ if(sel) sel.classList.remove("sel"); sel=null; scene.classList.remove("armed"); hint.textContent=HINT; }
    function select(it){ if(sel===it){deselect();return} if(sel) sel.classList.remove("sel"); sel=it; it.classList.add("sel"); scene.classList.add("armed"); hint.textContent="Now tap the right place! 👇"; K.sfx("flip"); }
    function place(it,bin){
      const item=items[+it.dataset.k];
      it.classList.remove("lift");
      if(accepts(bin,item)){
        it.classList.add("gone"); it.disabled=true; if(sel===it) deselect();
        bin.dataset.cnt=(+bin.dataset.cnt||0)+1; bin.classList.add("filled"); if(+bin.dataset.cap===1) bin.classList.add("hide-h");
        bin.querySelector(".sr-in").insertAdjacentHTML("beforeend",`<span class="sr-mini">${item.mini||item.html}</span>`);
        K.sfx("pop"); K.celebrate(bin); left--;
        if(item.say) LE.speak(item.say);
        if(left===0) ctl.right(); else ctl.fb(K.cheer()+" 🎉");
      }else{
        it.classList.add("bad"); setTimeout(()=>it.classList.remove("bad"),450); deselect(); ctl.wrong();
      }
    }
    /* tap alternative */
    bins.forEach(b=>{
      const act=e=>{ if(Date.now()-lastDrag<350) return; if(sel) place(sel,e&&e.clientX?resolve(b,e.clientX,e.clientY,items[+sel.dataset.k]):b); else ctl.fb("Tap a picture first, or drag it here!"); };
      b.addEventListener("click",act);
      b.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();act()} });
    });
    tray.addEventListener("click",e=>{ const it=e.target.closest(".sr-item"); if(it&&e.detail===0&&!it.classList.contains("gone")) select(it); }); /* keyboard */
    /* drag and drop with pointer events (works for mouse and touch) */
    /* outlines can overlap (a door sits on a house), so pick the one that accepts this piece */
    const accepts=(b,item)=>item.bin===b.dataset.b&&(+b.dataset.cnt||0)<+b.dataset.cap;
    function binsAt(x,y){ return document.elementsFromPoint(x,y).map(e=>e.closest&&e.closest(".sr-bin")).filter((b,i,a)=>b&&body.contains(b)&&a.indexOf(b)===i); }
    function resolve(b,x,y,item){ const c=binsAt(x,y); return (item&&c.find(k=>accepts(k,item)))||b; }
    function binAt(x,y,item){ const c=binsAt(x,y); return (item&&c.find(k=>accepts(k,item)))||c[0]||null; }
    function clearOver(){ bins.forEach(b=>b.classList.remove("over")); }
    tray.addEventListener("pointerdown",e=>{
      const it=e.target.closest(".sr-item"); if(!it||it.classList.contains("gone")||drag) return;
      drag={it:it,id:e.pointerId,sx:e.clientX,sy:e.clientY,moved:false,ghost:null};
      try{it.setPointerCapture(e.pointerId)}catch(_){}
    });
    tray.addEventListener("pointermove",e=>{
      if(!drag||e.pointerId!==drag.id) return;
      if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8){
        drag.moved=true; const g=document.createElement("div"); g.className="sr-ghost"; g.innerHTML=drag.it.innerHTML; document.body.appendChild(g); drag.ghost=g; drag.it.classList.add("lift");
      }
      if(drag.moved){ drag.ghost.style.left=e.clientX+"px"; drag.ghost.style.top=e.clientY+"px"; clearOver(); const b=binAt(e.clientX,e.clientY,items[+drag.it.dataset.k]); if(b) b.classList.add("over"); e.preventDefault(); }
    });
    function finish(e,cancel){
      if(!drag||e.pointerId!==drag.id) return;
      const d=drag; drag=null; clearOver();
      if(d.ghost){ d.ghost.remove(); lastDrag=Date.now(); const b=cancel?null:binAt(e.clientX,e.clientY,items[+d.it.dataset.k]); if(b) place(d.it,b); else d.it.classList.remove("lift"); }
      else if(!cancel){ select(d.it); }
    }
    tray.addEventListener("pointerup",e=>finish(e,false));
    tray.addEventListener("pointercancel",e=>finish(e,true));
  }}));
}

function sequence(host,api,o){
  K.rounds(host,api,Object.assign({},o,{make:()=>K.sample(o.sets,o.count||o.sets.length),draw(r,body,ctl){
    const steps=r.steps; let next=0, order;
    do{ order=K.shuffle(steps.map((_,i)=>i)); }while(order.every((v,i)=>v===i));
    body.innerHTML=`<div class="le-prompt"><div class="le-ask">${esc(r.title)}</div><div class="le-ask" data-q style="font-size:19px;color:var(--lav-d)">Tap what happens FIRST!</div>
        <button class="btn small ghost" data-s="1">🔊 Hear the steps</button></div>
      <div class="sq-slots">${steps.map((_,i)=>`<div class="sq-slot"><b>${i+1}</b><span></span></div>`).join("")}</div>
      <div class="le-fb" aria-live="polite"></div>
      <div class="le-opts">${order.map(i=>`<button class="le-opt sq-card" data-i="${i}"><span class="sq-e">${steps[i].e}</span><small>${esc(steps[i].t)}</small></button>`).join("")}</div>`;
    const q=body.querySelector("[data-q]"), slots=body.querySelectorAll(".sq-slot");
    body.querySelector("[data-s]").onclick=()=>K.hear(order.map(i=>steps[i].t).join(". "));
    body.querySelectorAll(".sq-card").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i; LE.speak(steps[i].t);
      if(i===next){
        const s=slots[next]; s.classList.add("on"); s.querySelector("span").innerHTML=`${steps[i].e}<small>${esc(steps[i].t)}</small>`;
        b.disabled=true; b.style.visibility="hidden"; K.sfx("pop"); K.celebrate(s); next++;
        if(next===steps.length) ctl.right("That is the right order!");
        else{ ctl.fb(K.cheer()+" 🎉"); q.textContent=next===steps.length-1?"Which one comes LAST?":"Now, what comes NEXT?"; }
      }else{
        b.classList.add("bad"); setTimeout(()=>b.classList.remove("bad"),450);
        ctl.wrong(next===0?"Think about what happens first.":"Think about what comes next.");
      }
    });
  }}));
}
Object.assign(K,{sorter:sorter,sequence:sequence});
})();
</script>
<script>
/* =========================================================
   STEP 3 — GAMES
   Shape sorting (drag & tap) · Guess the animal · Memory cards
   Picture matching · Shape puzzles · Find the missing object
   Picture sequencing · Sorting game
   ========================================================= */
(function(){
"use strict";
const LE=window.LittleExplorers,K=window.LEKit,esc=LE.esc;
const SK=LE.shapeKit, shape=n=>SK.SHAPES.find(s=>s.n===n), colOf=n=>SK.SHCOL[SK.SHAPES.findIndex(s=>s.n===n)];
const sv=(n,fill,stroke)=>`<svg viewBox="0 0 100 100" fill="${fill}" stroke="${stroke||"none"}" stroke-width="${stroke?4:0}" aria-hidden="true">${shape(n).s}</svg>`;

/* ---- 4. Shape Sorting: drag shapes into matching holes ---- */
LE.registerModule("colors","shape-sort",{render(host,api){
  const BASIC=["Circle","Square","Triangle","Star","Heart"];
  const rnd=names=>({ask:"Drag each shape to the hole with the same shape.",
    items:K.shuffle(names).map(n=>({html:sv(n,colOf(n)),bin:n,label:n,say:n})),
    bins:K.shuffle(names).map(n=>({id:n,html:sv(n,"#f3eefc","#9a82e6"),label:n}))});
  K.sorter(host,api,{icon:"🔷",title:"Shape Sorting",instr:"Drag each shape into the hole with the same shape. You can also tap a shape and then tap the hole.",
    make:()=>[rnd(K.sample(BASIC,3)),rnd(K.sample(BASIC,4)),Object.assign(rnd(["Rectangle","Oval","Circle","Square"]),{ask:"Look closely! Match each shape to its hole."})]});
}});

/* ---- Guess the Animal ---- */
LE.registerModule("animals","animal-guess",{render(host,api){
  const AN=LE.animalData, cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
  K.quiz(host,api,{icon:"🦁",title:"Guess the Animal",instr:"Look at the animal and pick its name. Sometimes you hear a name and pick the animal!",
    make:()=>K.sample(AN,8).map((a,i)=>{
      const three=K.shuffle([a].concat(K.sample(AN.filter(x=>x!==a),2)));
      if(i%2===0) return {prompt:`<div class="le-big">${a[1]}</div>`,ask:"What animal is this?",say:"What animal is this?",hearOpts:true,
        praise:"It is a "+a[0].toLowerCase()+"!",praiseSay:"It is a "+a[0],options:three.map(x=>({html:x[0],ok:x===a,label:x[0],txt:true}))};
      return {prompt:`<div class="le-big">🔎</div>`,ask:"Find the "+a[0].toLowerCase()+"!",say:"Find the "+a[0],
        praise:cap(a[0].toLowerCase())+" found!",praiseSay:a[0],options:three.map(x=>({html:`${x[1]}<small>${x[0]}</small>`,ok:x===a,label:x[0]}))};
    })});
}});

/* ---- 6. Memory matching (card flipping) ---- */
LE.registerModule("puzzles","memory-cards",{render(host,api){
  const POOL=["🐶","🐱","🐸","🐰","🦁","🐘","🍎","🍌","🍓","🚗","⭐","🌈","🐟","🦋"];
  const sh=K.shell(host,{icon:"🃏",title:"Memory Cards",instr:"Flip two cards. If they are the same, they stay open. Find all the pairs!"});
  function levels(){
    sh.dots.innerHTML="";
    sh.body.innerHTML=`<div class="le-ask" style="text-align:center">Choose a level</div><div class="le-opts">${[[3,"Easy","3 pairs"],[4,"Medium","4 pairs"],[6,"Big","6 pairs"]].map(l=>`<button class="le-opt txt" data-n="${l[0]}">${l[1]}<small>${l[2]}</small></button>`).join("")}</div>`;
    sh.body.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>play(+b.dataset.n));
  }
  function play(pairs){
    const deck=K.sample(POOL,pairs); const cards=K.shuffle(deck.concat(deck));
    let open=[],lock=false,found=0,tries=0;
    sh.body.innerHTML=`<div class="le-fb" aria-live="polite">Tries: 0</div><div class="mc-grid" style="--cols:${pairs===3?3:4}">${cards.map((e,i)=>`<button class="mc" data-i="${i}" data-e="${e}" aria-label="Card ${i+1}"><span class="mc-in"><span class="mc-f">❓</span><span class="mc-b">${e}</span></span></button>`).join("")}</div>
      <div class="le-actions"><button class="btn small ghost" data-a="lv">⬅ Change level</button></div>`;
    K.dots(sh.dots,pairs,0);
    const fb=(m,bad)=>{const f=sh.body.querySelector(".le-fb"); if(f){f.textContent=m;f.className="le-fb "+(bad?"bad":"good")+" pop"}};
    sh.body.querySelector('[data-a="lv"]').onclick=levels;
    sh.body.querySelectorAll(".mc").forEach(c=>c.onclick=()=>{
      if(lock||c.classList.contains("flip")||c.classList.contains("done")) return;
      c.classList.add("flip"); K.sfx("flip"); open.push(c);
      if(open.length<2) return;
      tries++; const [a,b]=open; open=[];
      if(a.dataset.e===b.dataset.e){
        found++; K.dots(sh.dots,pairs,found);
        setTimeout(()=>{ a.classList.add("done"); b.classList.add("done"); K.sfx("pop"); K.celebrate(a); },450);
        fb(K.cheer()+" 🎉 Tries: "+tries);
        if(found===pairs) setTimeout(()=>{ if(host.isConnected) K.doneScreen(sh.body,api,{text:"You found all "+pairs+" pairs in "+tries+" tries!",score:{c:pairs,t:tries},again:levels}); },1300);
      }else{
        lock=true; fb(K.TRY_AGAIN+" 💪 Tries: "+tries,true); K.sfx("bad");
        setTimeout(()=>{ a.classList.remove("flip"); b.classList.remove("flip"); lock=false; },1000);
      }
    });
  }
  levels();
}});

/* ---- Picture Matching: picture to its shadow ---- */
LE.registerModule("puzzles","picture-match",{render(host,api){
  const POOL=["🐶","🐱","🐸","🐰","🦁","🐘","🍎","🍌","🍓","🚗","⭐","🐟","🦋","🎈","🚲","🌳"];

    make:()=>[3,3,4].map(n=>K.sample(POOL,n)),
    draw(items,body,ctl){
      let sel=null,found=0;
      body.innerHTML=`<div class="le-fb" aria-live="polite"></div><div class="pm-cols">
        <div class="pm-col">${K.shuffle(items).map(e=>`<button class="pm-it" data-s="L" data-e="${e}"><span>${e}</span></button>`).join("")}</div>
        <div class="pm-col">${K.shuffle(items).map(e=>`<button class="pm-it sil" data-s="R" data-e="${e}" aria-label="shadow"><span>${e}</span></button>`).join("")}</div></div>`;
      body.querySelectorAll(".pm-it").forEach(b=>b.onclick=()=>{
        if(b.classList.contains("done")) return;
        if(sel&&sel!==b&&sel.dataset.s!==b.dataset.s){
          if(sel.dataset.e===b.dataset.e){
            sel.classList.remove("sel"); sel.classList.add("done"); b.classList.add("done"); b.classList.remove("sil"); sel=null; found++;
            K.sfx("pop"); K.celebrate(b);
            if(found===items.length) ctl.right(); else ctl.fb(K.cheer()+" 🎉");
          }else{
            const a=sel; sel=null; a.classList.remove("sel"); [a,b].forEach(x=>{x.classList.add("bad");setTimeout(()=>x.classList.remove("bad"),450)}); ctl.wrong();
          }
        }else{ if(sel) sel.classList.remove("sel"); sel=b; b.classList.add("sel"); K.sfx("flip"); }

LE.registerModule("puzzles","find-missing",{render(host,api){

      body.querySelector('[data-a="ready"]').onclick=()=>{
        const miss=r.items[r.miss];

        K.mcDraw({prompt:row(true),ask:"Which one is hiding?",say:"Which one is hiding?",options:opts,praise:"You found it!"},body,ctl);

    }});
