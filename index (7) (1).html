.btn.peach{background:var(--peach-d);box-shadow:0 6px 0 #d98a5a,var(--shadow-s)}
.btn.small.peach{box-shadow:0 4px 0 #d98a5a}
.btn,.le-opt,.cat,.game,.chip,.icon-btn,.nav button,.an-tabs button{position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn{transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-3px);filter:brightness(1.05)}
.btn:active{transform:translateY(3px) scale(.97)}
.cat,.game{transition:transform .2s,box-shadow .2s}
.cat:hover,.game:hover{transform:translateY(-6px) rotate(-.6deg)}
.cat:active,.game:active{transform:scale(.97)}
.icon-btn{transition:transform .15s,background .2s}
.icon-btn:hover{transform:scale(1.1) rotate(-6deg)}
.icon-btn.on{background:var(--mint);animation:bump 2.4s ease-in-out infinite}
.icon-btn.off{opacity:.55}
.btn:focus-visible,.icon-btn:focus-visible,.le-opt:focus-visible,.cat:focus-visible,.game:focus-visible,.toggle:focus-visible,.nav button:focus-visible{outline:4px solid var(--lav-d);outline-offset:3px}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.6);transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(2.6);opacity:0}}
/* floating shapes behind everything */
.floaties{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.fl{position:absolute;opacity:.55;animation:flUp linear infinite alternate,flTurn linear infinite}
.fl.circle,.fl.ring{border-radius:50%} .fl.sq{border-radius:14px} .fl.tri{clip-path:polygon(50% 0,100% 100%,0 100%)}
.fl.star{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
@keyframes flUp{from{transform:translateY(-30px)}to{transform:translateY(30px)}}
@keyframes flTurn{from{rotate:0deg}to{rotate:360deg}}
/* confetti shower */
.shower{position:fixed;inset:0;z-index:125;pointer-events:none;overflow:hidden}
.shower span{position:absolute;top:-40px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
/* twinkling stars */
.dn-star,#hudStars{animation:twinkle 1.6s ease-in-out infinite}
.dn-star{display:inline-block}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.18) rotate(8deg)}}
.logo-star,.logo .star{animation:twinkle 2.4s ease-in-out infinite}
/* characters: sway, blink, talk */
.char svg{overflow:visible}
.char-btn.talk{animation:talk .9s ease both!important}
@keyframes talk{0%{transform:scale(1)}20%{transform:scale(1.2) translateY(-14px) rotate(-6deg)}45%{transform:scale(1.12) translateY(0) rotate(5deg)}70%{transform:scale(1.15) rotate(-3deg)}100%{transform:scale(1)}}
/* screen transitions: items rise in one after another */
.view>*{animation:rise .5s cubic-bezier(.2,.9,.3,1) both}
.view>*:nth-child(2){animation-delay:.06s}.view>*:nth-child(3){animation-delay:.12s}.view>*:nth-child(4){animation-delay:.18s}.view>*:nth-child(5){animation-delay:.24s}.view>*:nth-child(n+6){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:none}}
.cat-grid>*,.games>*{animation:pop .45s both}
/* settings */
.vol{display:flex;flex-direction:column;gap:6px;font-weight:800}
.vol input[type=range]{width:100%;height:44px;accent-color:var(--lav-d)}
.toggle:focus-visible{outline-offset:4px}
/* gentle wrong answer (warm orange, never red) */
.le-opt.bad{background:#ffe9d6!important;border-color:#f3b27a!important}
/* touch + small screens */
@media (max-width:820px){
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:60;justify-content:space-around;gap:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:3px dashed rgba(154,130,230,.3);box-shadow:0 -6px 20px rgba(120,90,160,.12)}
  .nav button{display:flex;flex-direction:column;align-items:center;gap:0;font-size:13px;padding:6px 14px;border-radius:18px;min-height:52px}
  .nav .ico{display:block}
  .topbar{backdrop-filter:none;background:var(--cream)}
  .toast{bottom:110px}
  #app{padding-bottom:96px}
}
@media (max-width:480px){
  .topbar{gap:6px;padding-left:10px;padding-right:10px}
  .hud{gap:6px}
  .pill{padding:8px 10px;font-size:15px}
  .logo span.t{display:none}
  .btn.big{font-size:21px;padding:16px 24px}
}
@media (max-width:360px){ .icon-btn{width:44px;height:44px;font-size:18px} .logo svg,.logo .mark{width:34px;height:34px} }
@media (hover:none){ .btn:hover,.cat:hover,.game:hover,.icon-btn:hover,.char-btn:hover{transform:none;filter:none} }
@media (prefers-reduced-motion:reduce){ .floaties,.shower{display:none} }
/* touch-size fixes: everything tappable is at least 46px */
.nav button{min-height:46px}
.btn.small{min-height:46px}
.icon-btn{flex:none;min-width:44px;min-height:44px}
.tr-strip button{min-width:46px;min-height:46px}
.an-tabs button{min-height:46px}
.pill{white-space:nowrap;flex:none}
@media (max-width:380px){ .logo span.t.keep{display:none} }
</style>
</body>
</html>
